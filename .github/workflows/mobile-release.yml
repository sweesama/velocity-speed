name: Mobile App Cloud Build (iOS TestFlight & Android)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform to build (all, android, ios)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios
      upload_testflight:
        description: 'Upload signed iOS IPA to TestFlight (requires Apple secrets)'
        required: true
        default: false
        type: boolean

jobs:
  build-android:
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & build web bundle
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --no-frozen-lockfile
          else
            npm install
          fi
          npm run build

      - name: Prepare Capacitor Android project
        run: |
          if ! node -e "require.resolve('@capacitor/android')" 2>/dev/null; then
            npm install --no-save @capacitor/android@^8.5.3
          fi
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Ensure Android GPS permissions in AndroidManifest.xml
        run: |
          node -e "
            const fs = require('fs');
            const p = 'android/app/src/main/AndroidManifest.xml';
            let xml = fs.readFileSync(p, 'utf8');
            const perms = [
              'android.permission.ACCESS_FINE_LOCATION',
              'android.permission.ACCESS_COARSE_LOCATION',
              'android.permission.INTERNET'
            ];
            for (const perm of perms) {
              if (!xml.includes(perm)) {
                xml = xml.replace('<application', '    <uses-permission android:name=\"' + perm + '\" />\n    <application');
              }
            }
            fs.writeFileSync(p, xml, 'utf8');
          "

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build Signed Android Release AAB (if keystore secrets configured)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$PWD/release-keystore.jks \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          rm -f release-keystore.jks

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: velocity-android-build
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

  build-ios:
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios'
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies & build web bundle
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --no-frozen-lockfile
          else
            npm install
          fi
          npm run build

      - name: Prepare Capacitor iOS project
        run: |
          if ! node -e "require.resolve('@capacitor/ios')" 2>/dev/null; then
            npm install --no-save @capacitor/ios@^8.5.3
          fi
          if [ ! -d ios ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Inject iOS Location, Motion usage descriptions & Apple Privacy Manifest
        run: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'Velocity uses GPS to measure real-time speed, geometric altitude, and trip distance locally on your device.'" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription 'Velocity uses GPS to measure real-time speed, geometric altitude, and trip distance locally on your device.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSMotionUsageDescription string 'Velocity reads accelerometer data locally to measure forward G-force acceleration.'" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Set :NSMotionUsageDescription 'Velocity reads accelerometer data locally to measure forward G-force acceleration.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"

          node -e "
            const fs = require('fs');
            const xml = [
              '<?xml version=\"1.0\" encoding=\"UTF-8\"?>',
              '<!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">',
              '<plist version=\"1.0\">',
              '<dict>',
              '  <key>NSPrivacyTracking</key>',
              '  <false/>',
              '  <key>NSPrivacyTrackingDomains</key>',
              '  <array/>',
              '  <key>NSPrivacyCollectedDataTypes</key>',
              '  <array/>',
              '  <key>NSPrivacyAccessedAPITypes</key>',
              '  <array>',
              '    <dict>',
              '      <key>NSPrivacyAccessedAPIType</key>',
              '      <string>NSPrivacyAccessedAPICategoryUserDefaults</string>',
              '      <key>NSPrivacyAccessedAPITypeReasons</key>',
              '      <array><string>CA92.1</string></array>',
              '    </dict>',
              '  </array>',
              '</dict>',
              '</plist>'
            ].join('\n');
            fs.writeFileSync('ios/App/App/PrivacyInfo.xcprivacy', xml, 'utf8');
          "

      - name: Verify Unsigned iOS Build (when Apple signing secrets are not yet configured)
        if: ${{ env.HAS_APPLE_SECRETS != 'true' }}
        env:
          HAS_APPLE_SECRETS: ${{ secrets.APPLE_TEAM_ID != '' && secrets.APPLE_CERTIFICATE_BASE64 != '' }}
        run: |
          if [ -f ios/App/App.xcworkspace/contents.xcworkspacedata ]; then
            xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO build
          else
            xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO build
          fi

      - name: Build Signed IPA & Upload to TestFlight (when Apple Secrets are configured)
        if: ${{ secrets.APPLE_TEAM_ID != '' && secrets.APPLE_CERTIFICATE_BASE64 != '' && secrets.APPLE_PROVISIONING_PROFILE_BASE64 != '' }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "temp-pass" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "temp-pass" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "temp-pass" "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< $(security cms -D -i "$PROFILE_PATH"))
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          if [ -f ios/App/App.xcworkspace/contents.xcworkspacedata ]; then
            TARGET_FLAG="-workspace ios/App/App.xcworkspace"
          else
            TARGET_FLAG="-project ios/App/App.xcodeproj"
          fi

          xcodebuild $TARGET_FLAG \
            -scheme App \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Velocity.xcarchive" \
            archive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"

          node -e "
            const fs = require('fs');
            const xml = [
              '<?xml version=\"1.0\" encoding=\"UTF-8\"?>',
              '<!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">',
              '<plist version=\"1.0\">',
              '<dict>',
              '  <key>method</key>',
              '  <string>app-store-connect</string>',
              '  <key>teamID</key>',
              '  <string>' + process.env.APPLE_TEAM_ID + '</string>',
              '  <key>signingStyle</key>',
              '  <string>automatic</string>',
              '</dict>',
              '</plist>'
            ].join('\n');
            fs.writeFileSync(process.env.RUNNER_TEMP + '/ExportOptions.plist', xml, 'utf8');
          "

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Velocity.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          if [ "${{ github.event.inputs.upload_testflight }}" = "true" ] && [ -n "$ASC_API_KEY_ID" ] && [ -n "$ASC_API_ISSUER_ID" ] && [ -n "$ASC_API_PRIVATE_KEY" ]; then
            mkdir -p "$HOME/.appstoreconnect/private_keys"
            echo "$ASC_API_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
            IPA_FILE=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -n 1)
            xcrun altool --upload-app --type ios -f "$IPA_FILE" --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID"
          fi

          rm -rf "$CERT_PATH" "$PROFILE_PATH" "$HOME/.appstoreconnect/private_keys"

      - name: Upload iOS Build Artifact (if exported)
        if: ${{ secrets.APPLE_TEAM_ID != '' && secrets.APPLE_CERTIFICATE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: velocity-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: warn
